<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>堆叠收纳 · 我的书房</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background: #231e1a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    }

    .game-shell {
      width: 100%;
      max-width: 430px;
      height: 790px;
      max-height: 96vh;
      position: relative;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.45), 0 0 0 3px #4a3525;
      background: #f5dfbe;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 460px) {
      .game-shell {
        max-width: 100vw;
        height: 100dvh;
        max-height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    .ink-border { border: 2.5px solid #4a3525; }
    .ink-shadow { box-shadow: 0 3px 0 #4a3525; }
    .ink-btn {
      border: 2.5px solid #4a3525;
      box-shadow: 0 3px 0 #4a3525;
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.15s ease;
      cursor: pointer;
      font-family: inherit;
    }
    .ink-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #4a3525;
    }
    .ink-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Header */
    .header-bar {
      position: relative;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #f4be58;
      border-bottom: 2.5px solid #4a3525;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .icon-circle {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: #fffaf0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4a3525;
      padding: 0;
    }
    .header-center { text-align: center; }
    .header-title { font-size: 16px; font-weight: 900; color: #4a3525; letter-spacing: 0.5px; line-height: 1.2; }
    .header-sub { font-size: 11px; font-weight: 700; color: #7c5328; }
    .btn-next-lvl {
      height: 32px;
      padding: 0 11px;
      border-radius: 999px;
      background: #fff3d1;
      color: #4a3525;
      font-size: 12px;
      font-weight: 800;
    }

    /* Storage Boxes */
    .boxes-wrap { position: relative; z-index: 30; padding: 10px 12px 6px; }
    .boxes-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: stretch; }
    .box-card { position: relative; transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease; }
    .box-active {
      position: relative;
      width: 100%;
      height: 84px;
      border-radius: 12px;
      background: #fbf5e9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 6px;
    }
    .box-rim {
      width: 100%;
      height: 14px;
      background: #e8dfd0;
      border-bottom: 2px solid #4a3525;
      border-radius: 9px 9px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box-rim-handle { width: 40px; height: 4px; background: #cbbda8; border-radius: 999px; }
    .box-quick {
      position: absolute;
      top: -8px;
      left: -6px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #ea8848;
      border: 2px solid #4a3525;
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(74, 53, 37, 0.45);
      transition: transform 0.12s ease;
    }
    .box-quick:hover { transform: scale(1.06); }
    .box-name { font-size: 16px; font-weight: 900; color: #4a3525; line-height: 1; margin-top: 2px; }
    .box-badge {
      padding: 2px 12px;
      border-radius: 999px;
      border: 2px solid #4a3525;
      font-size: 11px;
      font-weight: 900;
      color: #2a211b;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }
    .box-locked {
      width: 100%;
      height: 84px;
      border-radius: 12px;
      background: #2c2724;
      color: #f4e9dc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0 8px 4px;
    }
    .box-locked-rim {
      width: calc(100% + 16px);
      height: 10px;
      background: #3f3833;
      border-radius: 9px 9px 0 0;
      margin-top: -6px;
      margin-bottom: 2px;
      border-bottom: 1px solid #1c1816;
    }
    .box-locked-title { font-size: 12px; font-weight: 800; color: #f7d89c; }
    .box-locked-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: #4a413b;
      color: #ffd479;
    }
    .box-empty {
      width: 100%;
      height: 84px;
      border-radius: 12px;
      border: 2px dashed #b59469;
      background: rgba(244, 228, 199, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #9c7b52;
      font-size: 12px;
      font-weight: 800;
    }

    .box-pop { animation: boxPop 0.34s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes boxPop {
      0% { transform: scale(1); }
      45% { transform: scale(1.1) translateY(-3px); }
      100% { transform: scale(1); }
    }
    .box-complete { animation: boxComplete 0.45s ease forwards; }
    @keyframes boxComplete {
      0% { transform: scale(1); opacity: 1; }
      35% { transform: scale(1.12) rotate(-2deg); opacity: 1; }
      100% { transform: scale(0.75) translateY(-32px); opacity: 0; }
    }
    .box-enter { animation: boxEnter 0.36s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes boxEnter {
      0% { transform: translateY(-22px) scale(0.82); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* Staging Tray */
    .tray-wrap { position: relative; z-index: 30; padding: 0 12px 8px; }
    .tray-container {
      background: #d8d3c9;
      border-radius: 12px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.12);
    }
    .tray-slot {
      flex: 1;
      height: 48px;
      border-radius: 8px;
      background: #fbf6ea;
      border: 2px solid #4a3525;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .tray-slot img { width: 38px; height: 38px; object-fit: contain; pointer-events: none; }
    .tray-slot-locked {
      flex: 1;
      height: 48px;
      border-radius: 8px;
      background: #2e2926;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f7d89c;
      font-size: 9px;
      font-weight: 700;
      gap: 1px;
    }
    .tray-shake { animation: trayShake 0.35s ease; }
    @keyframes trayShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* PixiJS WebGL2 Playfield */
    .playfield {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: #e4b77c;
    }
    .playfield canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* Bottom Helper Toolbar */
    .toolbar {
      position: relative;
      z-index: 30;
      background: #f6e3bf;
      border-top: 2.5px solid #4a3525;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tool-btn {
      flex: 1;
      padding: 7px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 800;
    }
    .tool-badge {
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
    }

    /* Flying overlay for seamless canvas -> DOM box/tray arc flight */
    .flying-item {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      will-change: transform;
    }
    .flying-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 8px rgba(48, 32, 20, 0.35));
    }

    /* Sparkles */
    .sparkle {
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      font-size: 16px;
      animation: sparkleFloat 0.72s ease-out forwards;
    }
    @keyframes sparkleFloat {
      0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.15); opacity: 0; }
    }

    /* Toast */
    .toast-pill {
      position: absolute;
      left: 50%;
      top: 196px;
      transform: translateX(-50%) translateY(-8px);
      background: rgba(74, 53, 37, 0.93);
      color: #fff8eb;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 95;
      white-space: nowrap;
    }
    .toast-pill.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Dual-Spotlight Tutorial */
    .hidden { display: none !important; }
    .tut-overlay { position: absolute; inset: 0; z-index: 80; pointer-events: none; }
    .tut-mask-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .tut-blocker { position: absolute; inset: 0; pointer-events: auto; }
    .tut-click-zone { position: absolute; pointer-events: auto; cursor: pointer; border-radius: 16px; }
    .tut-arrow {
      position: absolute;
      pointer-events: none;
      z-index: 82;
      animation: tutBounce 0.8s ease-in-out infinite;
    }
    @keyframes tutBounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -10px); }
    }
    .tut-bubble {
      position: absolute;
      background: #fff9ec;
      border: 2.5px solid #4a3525;
      border-radius: 14px;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 800;
      color: #4a3525;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      white-space: nowrap;
      pointer-events: none;
      z-index: 82;
    }
    .tut-bubble::before {
      content: '';
      position: absolute;
      top: -8px;
      left: var(--arrow-x, 50%);
      margin-left: -6px;
      width: 12px;
      height: 12px;
      background: #fff9ec;
      border-left: 2.5px solid #4a3525;
      border-top: 2.5px solid #4a3525;
      transform: rotate(45deg);
    }
    .tut-accent { color: #cf7b15; }
    .btn-skip-tut {
      pointer-events: auto;
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 85;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff6e3;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
    }

    /* Win / Lose Modal */
    .modal-overlay {
      position: absolute;
      inset: 0;
      z-index: 90;
      background: rgba(0, 0, 0, 0.48);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-card {
      width: 100%;
      max-width: 330px;
      background: #fffaf0;
      border-radius: 24px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    .modal-emoji { font-size: 46px; margin-bottom: 6px; }
    .modal-title { font-size: 20px; font-weight: 900; color: #4a3525; margin: 0 0 6px; }
    .modal-desc { font-size: 12px; font-weight: 600; color: #7b6048; margin: 0 0 14px; }
    .modal-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #f7ebd4;
      border: 1.5px solid #e0c8a0;
      border-radius: 16px;
      padding: 10px;
      margin-bottom: 14px;
    }
    .stat-label { font-size: 11px; color: #8a6a4b; font-weight: 700; }
    .stat-val { font-size: 16px; font-weight: 900; color: #4a3525; }
    .modal-actions { display: flex; flex-direction: column; gap: 8px; }
    .modal-btn-primary {
      width: 100%;
      padding: 10px;
      border-radius: 16px;
      background: #f4be58;
      color: #4a3525;
      font-size: 14px;
      font-weight: 900;
    }
    .modal-btn-secondary {
      width: 100%;
      padding: 8px;
      border-radius: 16px;
      background: #fffaf0;
      color: #6d5239;
      font-size: 12px;
      font-weight: 800;
    }
  </style>
  <script type="module" crossorigin src="./chunks/index-Ct83wU4Z.js"></script>
</head>
<body>
  <div id="gameShell" class="game-shell">
    <!-- Top Golden Header -->
    <div class="header-bar">
      <div class="header-left">
        <button id="btnSound" title="开关音效" class="ink-btn icon-circle">
          <svg id="iconSoundOn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="#f4be58"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <svg id="iconSoundOff" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="#d6c5b3"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>
        <button id="btnRestart" title="重新开始" class="ink-btn icon-circle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>
      </div>
      <div class="header-center">
        <div id="levelTitle" class="header-title">我的书房</div>
        <div id="levelSubtitle" class="header-sub">第 1 关 · 剩余 18 件</div>
      </div>
      <button id="btnLevelSwitch" class="ink-btn btn-next-lvl">下一关</button>
    </div>

    <!-- Top Storage Boxes -->
    <div class="boxes-wrap">
      <div id="boxesRow" class="boxes-row"></div>
    </div>

    <!-- Temporary Staging Tray -->
    <div class="tray-wrap">
      <div id="trayContainer" class="tray-container ink-border"></div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast-pill"></div>

    <!-- PixiJS v8 WebGL2 Playfield -->
    <div id="playfield" class="playfield"></div>

    <!-- Bottom Helper Toolbar -->
    <div class="toolbar">
      <button id="btnUndo" class="ink-btn tool-btn" style="background:#fffaf0;color:#4a3525;">
        <span>↩️</span><span>撤回</span>
        <span id="undoCount" class="tool-badge" style="background:#f4be58;color:#4a3525;">3</span>
      </button>
      <button id="btnHint" class="ink-btn tool-btn" style="background:#e7f8ef;color:#235743;">
        <span>✨</span><span>提示</span>
        <span id="hintCount" class="tool-badge" style="background:#7fd4b0;color:#235743;">5</span>
      </button>
      <button id="btnMagnet" class="ink-btn tool-btn" style="background:#ffeedc;color:#7a3b12;">
        <span>🧲</span><span>自动收</span>
        <span id="magnetCount" class="tool-badge" style="background:#f79d5c;color:#fff;">2</span>
      </button>
    </div>

    <!-- Dual-Spotlight Interactive Tutorial Overlay -->
    <div id="tutorialOverlay" class="tut-overlay hidden">
      <svg class="tut-mask-svg">
        <defs>
          <filter id="spotBlur" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="16" />
          </filter>
          <mask id="tutSpotMask">
            <rect width="100%" height="100%" fill="white" />
            <ellipse id="spotHole1" cx="0" cy="0" rx="0" ry="0" fill="black" filter="url(#spotBlur)" />
            <ellipse id="spotHole2" cx="0" cy="0" rx="0" ry="0" fill="black" filter="url(#spotBlur)" />
          </mask>
        </defs>
        <rect width="100%" height="100%" fill="rgba(22, 16, 11, 0.72)" mask="url(#tutSpotMask)" />
      </svg>
      <div class="tut-blocker"></div>
      <div id="tutClickZone" class="tut-click-zone"></div>
      <div id="tutBubbleTop" class="tut-bubble"></div>
      <div id="tutBubbleBottom" class="tut-bubble"></div>
      <div id="tutArrow" class="tut-arrow">
        <svg width="34" height="38" viewBox="0 0 34 38">
          <path d="M12 4 H22 V19 H30 L17 34 L4 19 H12 Z" fill="#fffdf8" stroke="#4a3525" stroke-width="3.2" stroke-linejoin="round"/>
        </svg>
      </div>
      <button id="btnSkipTut" class="btn-skip-tut">跳过引导</button>
    </div>

    <!-- Win / Lose Modal -->
    <div id="modalOverlay" class="modal-overlay hidden">
      <div class="modal-card ink-border">
        <div id="modalEmoji" class="modal-emoji">🎉</div>
        <h2 id="modalTitle" class="modal-title">房间整理完毕！</h2>
        <p id="modalDesc" class="modal-desc"></p>
        <div class="modal-stats">
          <div>
            <div class="stat-label">完成箱数</div>
            <div id="statBoxes" class="stat-val">4 / 4</div>
          </div>
          <div>
            <div class="stat-label">最高连击</div>
            <div id="statCombo" class="stat-val" style="color:#d97228;">0 连击</div>
          </div>
        </div>
        <div id="modalActions" class="modal-actions"></div>
      </div>
    </div>
  </div>

</body>
</html>
