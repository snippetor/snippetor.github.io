<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>堆叠收纳 · 我的书房</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: radial-gradient(circle at 50% 30%, #3b2f26 0%, #1d1713 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    }

    /* Full-height responsive mobile container */
    .game-shell {
      width: min(100vw, calc(100dvh * 0.54));
      max-width: 480px;
      height: 100dvh;
      max-height: 100dvh;
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 240, 215, 0.16);
      background: linear-gradient(180deg, #ead7b7 0%, #dfc69f 100%);
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 540px) {
      .game-shell {
        width: 100vw;
        max-width: 100vw;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* Realistic tactile button base */
    .soft-btn {
      border: 1px solid rgba(112, 76, 42, 0.28);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.78), 0 3px 8px rgba(66, 42, 20, 0.18), 0 1px 2px rgba(66, 42, 20, 0.14);
      transition: transform 0.1s ease, box-shadow 0.12s ease, filter 0.15s ease;
      cursor: pointer;
      font-family: inherit;
    }
    .soft-btn:hover:not(:disabled) { filter: brightness(1.03); }
    .soft-btn:active:not(:disabled) {
      transform: translateY(1.5px) scale(0.985);
      box-shadow: inset 0 1px 2px rgba(66, 42, 20, 0.15), 0 1px 3px rgba(66, 42, 20, 0.16);
    }
    .soft-btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    /* Top Warm Oak Header Bar */
    .header-bar {
      position: relative;
      z-index: 30;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: max(8px, env(safe-area-inset-top)) 14px 9px;
      background: linear-gradient(180deg, #e5b76b 0%, #d39c4c 52%, #c48b3d 100%);
      border-bottom: 1.5px solid rgba(92, 58, 25, 0.38);
      box-shadow: inset 0 1px 0 rgba(255, 245, 220, 0.5), 0 3px 10px rgba(72, 44, 18, 0.2);
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .icon-circle {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: linear-gradient(180deg, #fffdf8 0%, #f1e3cc 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #543921;
      padding: 0;
    }
    .header-center { text-align: center; }
    .header-title {
      font-size: 16px;
      font-weight: 800;
      color: #3d2612;
      letter-spacing: 0.6px;
      line-height: 1.2;
      text-shadow: 0 1px 0 rgba(255, 246, 224, 0.55);
    }
    .header-sub {
      font-size: 11px;
      font-weight: 600;
      color: #633f1c;
    }
    .btn-next-lvl {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, #fff9ec 0%, #f3dfba 100%);
      color: #4f3319;
      font-size: 12px;
      font-weight: 700;
    }

    /* Realistic 3D Storage Bins Area */
    .boxes-wrap {
      position: relative;
      z-index: 30;
      flex-shrink: 0;
      padding: 10px 12px 7px;
      background: linear-gradient(180deg, rgba(242, 226, 198, 0.96) 0%, rgba(232, 211, 178, 0.92) 100%);
    }
    .boxes-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: stretch; }
    .box-card { position: relative; transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease; }

    .box-active {
      position: relative;
      width: 100%;
      height: 82px;
      border-radius: 12px;
      background: linear-gradient(180deg, #fffcf6 0%, #f3eadc 70%, #e7dac6 100%);
      border: 1px solid rgba(122, 92, 62, 0.32);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 5px 12px rgba(68, 45, 22, 0.18), 0 2px 0 #c8b59a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 6px;
    }
    /* Recessed inner box opening */
    .box-rim {
      width: 100%;
      height: 15px;
      background: linear-gradient(180deg, #c9baa4 0%, #ded2be 55%, #ede3d3 100%);
      border-bottom: 1px solid rgba(118, 92, 64, 0.25);
      border-radius: 11px 11px 2px 2px;
      box-shadow: inset 0 3px 5px rgba(72, 52, 32, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box-rim-handle {
      width: 36px;
      height: 4px;
      background: rgba(110, 84, 58, 0.35);
      border-radius: 999px;
      box-shadow: inset 0 1px 2px rgba(45, 30, 16, 0.35);
    }
    .box-quick {
      position: absolute;
      top: -7px;
      left: -5px;
      padding: 2px 8px;
      border-radius: 999px;
      background: linear-gradient(180deg, #f39a55 0%, #dc7731 100%);
      border: 1px solid rgba(115, 52, 16, 0.45);
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 232, 200, 0.55), 0 2px 5px rgba(96, 46, 14, 0.32);
      transition: transform 0.12s ease;
    }
    .box-quick:hover { transform: scale(1.06); }
    .box-name { font-size: 15px; font-weight: 800; color: #432d1a; line-height: 1; margin-top: 2px; }
    .box-badge {
      padding: 2px 12px;
      border-radius: 999px;
      border: 1px solid rgba(64, 46, 30, 0.26);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 1px 3px rgba(64, 46, 30, 0.14);
      font-size: 11px;
      font-weight: 800;
      color: #2b2118;
      font-variant-numeric: tabular-nums;
      line-height: 1.25;
    }

    /* Matte dark charcoal locked bin */
    .box-locked {
      width: 100%;
      height: 82px;
      border-radius: 12px;
      background: linear-gradient(180deg, #3c3632 0%, #2a2522 100%);
      border: 1px solid rgba(255, 236, 204, 0.14);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 5px 12px rgba(24, 16, 10, 0.28), 0 2px 0 #1c1816;
      color: #f4e9dc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0 8px 4px;
    }
    .box-locked-rim {
      width: calc(100% + 16px);
      height: 11px;
      background: linear-gradient(180deg, #25211e 0%, #3a3430 100%);
      border-radius: 11px 11px 0 0;
      margin-top: -5px;
      margin-bottom: 2px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.45);
    }
    .box-locked-title { font-size: 12px; font-weight: 700; color: #f5d89e; }
    .box-locked-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(255, 214, 128, 0.16);
      border: 1px solid rgba(255, 214, 128, 0.3);
      color: #ffd98a;
    }

    .box-empty {
      width: 100%;
      height: 82px;
      border-radius: 12px;
      border: 1.5px dashed rgba(148, 114, 76, 0.48);
      background: rgba(244, 232, 210, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #94724c;
      font-size: 12px;
      font-weight: 700;
    }

    .box-pop { animation: boxPop 0.32s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes boxPop {
      0% { transform: scale(1); }
      45% { transform: scale(1.08) translateY(-2px); }
      100% { transform: scale(1); }
    }
    .box-complete { animation: boxComplete 0.44s ease forwards; }
    @keyframes boxComplete {
      0% { transform: scale(1); opacity: 1; }
      35% { transform: scale(1.1) rotate(-1.5deg); opacity: 1; }
      100% { transform: scale(0.78) translateY(-28px); opacity: 0; }
    }
    .box-enter { animation: boxEnter 0.34s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes boxEnter {
      0% { transform: translateY(-20px) scale(0.84); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* Recessed Wooden Desk Organizer Staging Tray */
    .tray-wrap {
      position: relative;
      z-index: 30;
      flex-shrink: 0;
      padding: 0 12px 9px;
      background: linear-gradient(180deg, rgba(232, 211, 178, 0.92) 0%, rgba(218, 192, 152, 0.95) 100%);
      border-bottom: 1.5px solid rgba(102, 70, 38, 0.28);
      box-shadow: 0 4px 10px rgba(56, 36, 16, 0.16);
    }
    .tray-container {
      background: linear-gradient(180deg, #b89468 0%, #c9a679 100%);
      border: 1px solid rgba(92, 60, 28, 0.35);
      border-radius: 13px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      box-shadow: inset 0 2px 6px rgba(64, 38, 14, 0.34), 0 1px 0 rgba(255, 245, 224, 0.55);
    }
    .tray-slot {
      flex: 1;
      height: 46px;
      border-radius: 9px;
      background: linear-gradient(180deg, #f3e9d8 0%, #fcf8ef 100%);
      border: 1px solid rgba(112, 82, 50, 0.28);
      box-shadow: inset 0 2px 4px rgba(84, 58, 30, 0.14), 0 1px 0 rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .tray-slot img { width: 38px; height: 38px; object-fit: contain; pointer-events: none; filter: drop-shadow(0 2px 2px rgba(48, 30, 14, 0.2)); }
    .tray-slot-locked {
      flex: 1;
      height: 46px;
      border-radius: 9px;
      background: linear-gradient(180deg, #3c3632 0%, #2a2522 100%);
      border: 1px solid rgba(255, 232, 194, 0.15);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 2px 4px rgba(24, 16, 10, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f5d89e;
      font-size: 9px;
      font-weight: 700;
      gap: 1px;
      cursor: pointer;
    }
    .tray-shake { animation: trayShake 0.35s ease; }
    @keyframes trayShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* PixiJS WebGL2 Playfield (Flexible height!) */
    .playfield {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      background: #c89d68;
      touch-action: none;
    }
    .playfield canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }

    /* Sleek Floating Zoom Controls */
    .zoom-pill {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 35;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border-radius: 999px;
      background: rgba(45, 34, 25, 0.68);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 240, 214, 0.22);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
    }
    .zoom-btn {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: none;
      background: rgba(255, 248, 236, 0.14);
      color: #fff6e5;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }
    .zoom-btn:active { background: rgba(255, 248, 236, 0.3); }
    .zoom-readout {
      min-width: 40px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #f7e4c0;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }

    /* Bottom Tactile Helper Toolbar */
    .toolbar {
      position: relative;
      z-index: 30;
      flex-shrink: 0;
      background: linear-gradient(180deg, #ecd8b6 0%, #dfc499 100%);
      border-top: 1.5px solid rgba(102, 70, 38, 0.28);
      box-shadow: inset 0 1px 0 rgba(255, 249, 236, 0.65), 0 -3px 10px rgba(64, 40, 18, 0.12);
      padding: 8px 12px max(10px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .tool-btn {
      flex: 1;
      padding: 8px 8px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 800;
    }
    .tool-badge {
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
    }

    /* Flying overlay */
    .flying-item {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      will-change: transform;
    }
    .flying-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 10px rgba(42, 26, 12, 0.38));
    }

    /* Sparkles */
    .sparkle {
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      font-size: 16px;
      animation: sparkleFloat 0.72s ease-out forwards;
    }
    @keyframes sparkleFloat {
      0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.15); opacity: 0; }
    }

    /* Toast */
    .toast-pill {
      position: absolute;
      left: 50%;
      top: 198px;
      transform: translateX(-50%) translateY(-8px);
      background: rgba(46, 33, 22, 0.9);
      backdrop-filter: blur(6px);
      color: #fff8eb;
      padding: 7px 15px;
      border-radius: 999px;
      border: 1px solid rgba(255, 236, 204, 0.2);
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 95;
      white-space: nowrap;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }
    .toast-pill.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Dual-Spotlight Tutorial */
    .hidden { display: none !important; }
    .tut-overlay { position: absolute; inset: 0; z-index: 80; pointer-events: none; }
    .tut-mask-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .tut-blocker { position: absolute; inset: 0; pointer-events: auto; }
    .tut-click-zone { position: absolute; pointer-events: auto; cursor: pointer; border-radius: 16px; }
    .tut-arrow {
      position: absolute;
      pointer-events: none;
      z-index: 82;
      animation: tutBounce 0.8s ease-in-out infinite;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
    }
    @keyframes tutBounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -10px); }
    }
    .tut-bubble {
      position: absolute;
      background: linear-gradient(180deg, #fffdf9 0%, #f7efe0 100%);
      border: 1.5px solid rgba(114, 78, 44, 0.42);
      border-radius: 14px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 800;
      color: #462e19;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      white-space: nowrap;
      pointer-events: none;
      z-index: 82;
    }
    .tut-bubble::before {
      content: '';
      position: absolute;
      top: -7px;
      left: var(--arrow-x, 50%);
      margin-left: -6px;
      width: 12px;
      height: 12px;
      background: #fffdf9;
      border-left: 1.5px solid rgba(114, 78, 44, 0.42);
      border-top: 1.5px solid rgba(114, 78, 44, 0.42);
      transform: rotate(45deg);
    }
    .tut-accent { color: #c96f16; }
    .btn-skip-tut {
      pointer-events: auto;
      position: absolute;
      right: 12px;
      bottom: 14px;
      z-index: 85;
      padding: 6px 13px;
      border-radius: 999px;
      background: rgba(34, 24, 16, 0.65);
      backdrop-filter: blur(6px);
      color: #fff6e3;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid rgba(255, 240, 214, 0.28);
      cursor: pointer;
    }

    /* Level 2 Pinch-to-Zoom Interactive Guide */
    .zoom-guide-overlay {
      position: absolute;
      inset: 0;
      z-index: 84;
      background: rgba(20, 14, 10, 0.56);
      backdrop-filter: blur(1.5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .zoom-guide-card {
      width: 100%;
      max-width: 290px;
      background: linear-gradient(180deg, #fffdf8 0%, #f5ebd8 100%);
      border: 1.5px solid rgba(116, 80, 46, 0.36);
      border-radius: 22px;
      padding: 20px 18px 18px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }
    .pinch-stage {
      position: relative;
      width: 120px;
      height: 82px;
      margin: 0 auto 10px;
      border-radius: 16px;
      background: rgba(214, 184, 142, 0.24);
      border: 1px dashed rgba(138, 98, 56, 0.42);
      overflow: hidden;
    }
    .pinch-dot {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, #fff9eb, #eab154);
      border: 2px solid #fff;
      box-shadow: 0 3px 10px rgba(96, 56, 18, 0.4);
      top: 50%;
      left: 50%;
      margin: -13px 0 0 -13px;
    }
    .pinch-dot.left { animation: pinchLeft 1.6s ease-in-out infinite; }
    .pinch-dot.right { animation: pinchRight 1.6s ease-in-out infinite; }
    @keyframes pinchLeft {
      0%, 100% { transform: translate(-10px, 8px) scale(0.92); opacity: 0.9; }
      55% { transform: translate(-34px, 20px) scale(1.08); opacity: 1; }
    }
    @keyframes pinchRight {
      0%, 100% { transform: translate(10px, -8px) scale(0.92); opacity: 0.9; }
      55% { transform: translate(34px, -20px) scale(1.08); opacity: 1; }
    }
    .zoom-guide-title { font-size: 16px; font-weight: 800; color: #432b16; margin: 0 0 6px; }
    .zoom-guide-sub { font-size: 12px; font-weight: 600; color: #7c5b3b; margin: 0 0 14px; line-height: 1.5; }

    /* Win / Lose Modal */
    .modal-overlay {
      position: absolute;
      inset: 0;
      z-index: 90;
      background: rgba(20, 14, 10, 0.52);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-card {
      width: 100%;
      max-width: 330px;
      background: linear-gradient(180deg, #fffdf9 0%, #f6ecdb 100%);
      border: 1.5px solid rgba(114, 78, 44, 0.38);
      border-radius: 24px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.92);
    }
    .modal-emoji { font-size: 46px; margin-bottom: 6px; }
    .modal-title { font-size: 20px; font-weight: 900; color: #432b16; margin: 0 0 6px; }
    .modal-desc { font-size: 12px; font-weight: 600; color: #7b5d3f; margin: 0 0 14px; }
    .modal-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(226, 203, 168, 0.42);
      border: 1px solid rgba(154, 118, 76, 0.28);
      border-radius: 16px;
      padding: 10px;
      margin-bottom: 14px;
    }
    .stat-label { font-size: 11px; color: #8a6a4b; font-weight: 700; }
    .stat-val { font-size: 16px; font-weight: 900; color: #432b16; }
    .modal-actions { display: flex; flex-direction: column; gap: 8px; }
    .modal-btn-primary {
      width: 100%;
      padding: 11px;
      border-radius: 14px;
      background: linear-gradient(180deg, #f2c063 0%, #dd9c3b 100%);
      color: #3f2610;
      font-size: 14px;
      font-weight: 800;
    }
    .modal-btn-secondary {
      width: 100%;
      padding: 9px;
      border-radius: 14px;
      background: linear-gradient(180deg, #fffdf8 0%, #f1e3cb 100%);
      color: #6b4e33;
      font-size: 12px;
      font-weight: 700;
    }
  </style>
  <script type="module" crossorigin src="./chunks/index-BQ3YBbFQ.js"></script>
</head>
<body>
  <div id="gameShell" class="game-shell">
    <!-- Top Warm Oak Header -->
    <div class="header-bar">
      <div class="header-left">
        <button id="btnSound" title="开关音效" class="soft-btn icon-circle">
          <svg id="iconSoundOn" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="#e5b76b"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <svg id="iconSoundOff" class="hidden" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="#d6c5b3"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>
        <button id="btnRestart" title="重新开始" class="soft-btn icon-circle">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>
      </div>
      <div class="header-center">
        <div id="levelTitle" class="header-title">我的书房</div>
        <div id="levelSubtitle" class="header-sub">第 1 关 · 剩余 18 件</div>
      </div>
      <button id="btnLevelSwitch" class="soft-btn btn-next-lvl">下一关</button>
    </div>

    <!-- Top Storage Bins -->
    <div class="boxes-wrap">
      <div id="boxesRow" class="boxes-row"></div>
    </div>

    <!-- Temporary Staging Tray -->
    <div class="tray-wrap">
      <div id="trayContainer" class="tray-container"></div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast-pill"></div>

    <!-- PixiJS v8 WebGL2 Playfield -->
    <div id="playfield" class="playfield">
      <!-- Sleek Floating Zoom Controls -->
      <div class="zoom-pill" id="zoomPill">
        <button id="btnZoomOut" class="zoom-btn" title="缩小">−</button>
        <span id="zoomReadout" class="zoom-readout" title="重置缩放">100%</span>
        <button id="btnZoomIn" class="zoom-btn" title="放大">+</button>
      </div>
    </div>

    <!-- Bottom Helper Toolbar -->
    <div class="toolbar">
      <button id="btnUndo" class="soft-btn tool-btn" style="background:linear-gradient(180deg,#fffdf8,#f0e3cc);color:#4a311a;">
        <span>↩️</span><span>撤回</span>
        <span id="undoCount" class="tool-badge" style="background:#e8b962;color:#3d250f;">3</span>
      </button>
      <button id="btnHint" class="soft-btn tool-btn" style="background:linear-gradient(180deg,#f3fcf7,#d9efe2);color:#22533e;">
        <span>✨</span><span>提示</span>
        <span id="hintCount" class="tool-badge" style="background:#7bc9a4;color:#173d2c;">5</span>
      </button>
      <button id="btnMagnet" class="soft-btn tool-btn" style="background:linear-gradient(180deg,#fff6ec,#f6dfca);color:#753911;">
        <span>🧲</span><span>自动收</span>
        <span id="magnetCount" class="tool-badge" style="background:#e68a46;color:#fff;">2</span>
      </button>
    </div>

    <!-- Level 1 Dual-Spotlight Interactive Tutorial -->
    <div id="tutorialOverlay" class="tut-overlay hidden">
      <svg class="tut-mask-svg">
        <defs>
          <filter id="spotBlur" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="16" />
          </filter>
          <mask id="tutSpotMask">
            <rect width="100%" height="100%" fill="white" />
            <ellipse id="spotHole1" cx="0" cy="0" rx="0" ry="0" fill="black" filter="url(#spotBlur)" />
            <ellipse id="spotHole2" cx="0" cy="0" rx="0" ry="0" fill="black" filter="url(#spotBlur)" />
          </mask>
        </defs>
        <rect width="100%" height="100%" fill="rgba(22, 16, 11, 0.72)" mask="url(#tutSpotMask)" />
      </svg>
      <div class="tut-blocker"></div>
      <div id="tutClickZone" class="tut-click-zone"></div>
      <div id="tutBubbleTop" class="tut-bubble"></div>
      <div id="tutBubbleBottom" class="tut-bubble"></div>
      <div id="tutArrow" class="tut-arrow">
        <svg width="34" height="38" viewBox="0 0 34 38">
          <path d="M12 4 H22 V19 H30 L17 34 L4 19 H12 Z" fill="#fffdf8" stroke="#5a3b20" stroke-width="2.6" stroke-linejoin="round"/>
        </svg>
      </div>
      <button id="btnSkipTut" class="btn-skip-tut">跳过引导</button>
    </div>

    <!-- Level 2 Pinch-to-Zoom Interactive Guide -->
    <div id="zoomGuideOverlay" class="zoom-guide-overlay hidden">
      <div class="zoom-guide-card">
        <div class="pinch-stage">
          <div class="pinch-dot left"></div>
          <div class="pinch-dot right"></div>
        </div>
        <h3 class="zoom-guide-title">双指缩放查看细节</h3>
        <p class="zoom-guide-sub">
          物品较多时，可用<strong>双指捏合</strong>放大或缩小画面；放大后可<strong>单指拖动</strong>浏览床面角落。<br/>
          <span style="opacity:0.8;">（电脑端可使用鼠标滚轮或右下角 +/- 按钮）</span>
        </p>
        <button id="btnDismissZoomGuide" class="soft-btn modal-btn-primary">我知道了，开始整理</button>
      </div>
    </div>

    <!-- Win / Lose Modal -->
    <div id="modalOverlay" class="modal-overlay hidden">
      <div class="modal-card">
        <div id="modalEmoji" class="modal-emoji">🎉</div>
        <h2 id="modalTitle" class="modal-title">房间整理完毕！</h2>
        <p id="modalDesc" class="modal-desc"></p>
        <div class="modal-stats">
          <div>
            <div class="stat-label">完成箱数</div>
            <div id="statBoxes" class="stat-val">4 / 4</div>
          </div>
          <div>
            <div class="stat-label">最高连击</div>
            <div id="statCombo" class="stat-val" style="color:#c9681e;">0 连击</div>
          </div>
        </div>
        <div id="modalActions" class="modal-actions"></div>
      </div>
    </div>
  </div>

</body>
</html>
