<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #2b221b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    }

    /* Full-height responsive mobile container — frameless edge-to-edge desk! */
    .game-shell {
      width: min(100vw, calc(100dvh * 0.54));
      max-width: 480px;
      height: 100dvh;
      max-height: 100dvh;
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5), 0 0 0 2.5px #432d1c;
      background: #d8a56e;
    }

    @media (max-width: 540px) {
      .game-shell {
        width: 100vw;
        max-width: 100vw;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* Full-bleed PixiJS 90° Top-Down Playfield (100% of viewport height!) */
    .playfield {
      position: absolute;
      inset: 0;
      overflow: hidden;
      touch-action: none;
    }
    .playfield canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }

    /* Hand-drawn raster UI button interaction (100% authentic Plan 1 artwork!) */
    .ui-img-btn {
      border: none;
      background: transparent;
      padding: 0;
      margin: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease;
      filter: drop-shadow(0 2.5px 3px rgba(64, 38, 18, 0.24));
    }
    .ui-img-btn:active:not(:disabled) {
      transform: translateY(1.5px) scale(0.96);
    }
    .ui-img-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    /* Compact Frameless Top Floating HUD (100% Authentic Plan 1 Artwork!) */
    .floating-hud {
      position: absolute;
      top: max(8px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      z-index: 30;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    /* Row 1: Authentic Hand-Drawn Round Buttons + Serrated Paper Ribbon + Next Pill */
    .top-nav-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      pointer-events: none;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 72px;
      pointer-events: auto;
    }
    .icon-circle {
      width: 36px;
      height: 36px;
    }

    .kraft-ribbon {
      position: relative;
      pointer-events: auto;
      width: 152px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2.5px 3px rgba(64, 38, 18, 0.22));
    }
    .kraft-ribbon-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
    }
    .ribbon-title {
      position: relative;
      z-index: 1;
      font-size: 14.5px;
      font-weight: 600;
      color: #3a2417;
      letter-spacing: 0.7px;
      white-space: nowrap;
      margin-top: -1px;
    }

    .btn-next-lvl {
      pointer-events: auto;
      width: 72px;
      height: 36px;
    }

    /* Row 2: Compact Authentic Plan-1 Hand-Drawn Boxes (true undistorted aspect ratio!) */
    .boxes-row {
      width: 100%;
      max-width: 312px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      align-items: center;

    }
    .box-card {

      pointer-events: auto;

    .bin-active, .bin-btn, .bin-empty {

    .bin-btn:active { transform: translateY(1.5px) scale(0.97); }
    .bin-art-img {

      inset: 0;

      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      filter: drop-shadow(0 3px 4px rgba(64, 38, 18, 0.22));
    }
    /* Exact Plan 1 pastel sticky label placed cleanly on front cream wall */
    .bin-sticker {
      position: absolute;
      left: 20%;
      right: 20%;
      bottom: 9%;
      height: 32%;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

    .bin-cat-name {
      font-size: 13px;
      font-weight: 600;
      color: #362216;

    }
    .bin-cat-count {

      color: #442c1c;
      font-variant-numeric: tabular-nums;

    /* Ad-triggered "装满 📹" pill badge on top-left rim of active box (matching reference!) */
    .box-quick {
      position: absolute;
      top: 6%;
      left: -3%;
      height: 20px;

    .box-quick:active { transform: scale(0.92); }

    .bin-locked-label {
      position: absolute;

      right: 12%;

      bottom: 8%;
      display: flex;
      flex-direction: column;
      align-items: center;

      font-size: 11.5px;
      font-weight: 900;

    .bin-locked-label svg {
      width: 19px;
      height: 15px;
      filter: drop-shadow(0 1.5px 0 rgba(56, 36, 20, 0.55));

    .bin-empty-inner {
      position: absolute;
      inset: 6%;
      border: 2px dashed #8f6a45;
      border-radius: 12px;
      background: rgba(253, 246, 230, 0.42);

      align-items: center;
      justify-content: center;

      font-weight: 900;

    .box-pop { animation: boxPop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes boxPop {
      0% { transform: scale(1); }
      45% { transform: scale(1.07) translateY(-2px); }
      100% { transform: scale(1); }
    }
    .box-complete { animation: boxComplete 0.4s ease forwards; }
    @keyframes boxComplete {
      0% { transform: scale(1); opacity: 1; }
      35% { transform: scale(1.08) rotate(-1.5deg); opacity: 1; }
      100% { transform: scale(0.78) translateY(-24px); opacity: 0; }
    }
    .box-enter { animation: boxEnter 0.32s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes boxEnter {
      0% { transform: translateY(-16px) scale(0.84); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* Row 3: Compact Authentic Plan-1 Carved Oak 7-Slot Wooden Tray (7 equal-width wide slots: 5 cream + 2 ad-locked) */
    .tray-container {
      position: relative;
      pointer-events: auto;
      width: 312px;
      max-width: 94%;
      aspect-ratio: 620 / 146;
      filter: drop-shadow(0 3px 4px rgba(64, 38, 18, 0.24));
    }
    .tray-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
    }
    .tray-slots-grid {
      position: absolute;
      top: 9%;
      bottom: 24%;
      left: 2.3%;
      right: 2.3%;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1.3%;
      align-items: stretch;
    }
    .tray-slot {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .tray-slot-unlocked-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 3px;
      pointer-events: none;
    }
    .tray-slot .tray-item-img {
      position: relative;
      z-index: 2;
      width: 82%;
      height: 82%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      filter: drop-shadow(0 1.5px 1.5px rgba(64, 38, 18, 0.3));
    }
    .tray-slot-locked {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;

    .tray-slot-locked svg {
      width: 22px;
      height: 17px;
      filter: drop-shadow(0 1.5px 0 rgba(56, 34, 18, 0.5));
      pointer-events: none;
    }
    .tray-slot-locked:active { background: rgba(255, 236, 190, 0.18); border-radius: 4px; }
    .tray-shake { animation: trayShake 0.35s ease; }
    @keyframes trayShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* Pan hint badge (only for wide Level 2/3 scenes) */
    .pan-hint-badge {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 35;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(253, 246, 230, 0.92);
      color: #442c1a;
      font-size: 10.5px;
      font-weight: 800;
      border: 1.8px solid #442c1a;
      box-shadow: 0 2px 3px rgba(68, 44, 26, 0.24);
      pointer-events: none;
      white-space: nowrap;
    }

    /* Flying overlay & Sparkles */
    .flying-item { position: fixed; pointer-events: none; z-index: 9999; will-change: transform; }
    .flying-item img, .flying-item canvas { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 6px 6px rgba(67, 45, 28, 0.3)); }
    .sparkle { position: fixed; pointer-events: none; z-index: 9998; font-size: 16px; animation: sparkleFloat 0.72s ease-out forwards; }
    @keyframes sparkleFloat {
      0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.15); opacity: 0; }
    }

    /* Toast */
    .toast-pill {
      position: absolute;
      left: 50%;
      top: 170px;
      transform: translateX(-50%) translateY(-8px);
      background: rgba(74, 49, 29, 0.92);
      color: #fffaf0;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1.5px solid #f5e5c5;
      font-size: 11.5px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 95;
      white-space: nowrap;
    }
    .toast-pill.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Level 1 Dual-Spotlight Tutorial */
    .hidden { display: none !important; }
    .tut-overlay { position: absolute; inset: 0; z-index: 80; pointer-events: none; }
    .tut-mask-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .tut-blocker { position: absolute; inset: 0; pointer-events: auto; }
    .tut-click-zone { position: absolute; pointer-events: auto; cursor: pointer; border-radius: 16px; }
    .tut-arrow { position: absolute; pointer-events: none; z-index: 82; animation: tutBounce 0.8s ease-in-out infinite; }
    @keyframes tutBounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -10px); }
    }
    .tut-bubble {
      position: absolute;
      background: #fffdf5;
      border: 2.2px solid #4a311d;
      border-radius: 13px;
      padding: 8px 14px;
      font-size: 13.5px;
      font-weight: 800;
      color: #4a311d;
      box-shadow: 0 3px 0 #4a311d;
      white-space: nowrap;
      pointer-events: none;
      z-index: 82;
    }
    .tut-bubble::before {
      content: '';
      position: absolute;
      top: -7px;
      left: var(--arrow-x, 50%);
      margin-left: -6px;
      width: 11px;
      height: 11px;
      background: #fffdf5;
      border-left: 2.2px solid #4a311d;
      border-top: 2.2px solid #4a311d;
      transform: rotate(45deg);
    }
    .tut-accent { color: #d67617; }
    .btn-skip-tut {
      pointer-events: auto;
      position: absolute;
      right: 12px;
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 85;
      padding: 6px 13px;
      border-radius: 999px;

      font-size: 11px;
      font-weight: 800;
      border: 1.5px solid rgba(255, 250, 240, 0.4);

    /* Adorable Flat Comic Modals */
    .cute-modal-overlay {
      position: absolute;
      inset: 0;
      z-index: 90;
      background: rgba(20, 14, 10, 0.56);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .cute-modal-card {
      width: 100%;
      max-width: 340px;
      background: #fffdf5;
      border: 2.5px solid #4a311d;
      border-radius: 20px;

    }
    .cute-modal-banner {
      position: relative;
      background: #ffc24e;
      border-bottom: 2.5px solid #4a311d;
      border-radius: 17px 17px 0 0;

    .sticker-title {

    .banner-star {

    }
    @keyframes starTwinkle {

    }
    .cute-modal-body { padding: 16px 18px 20px; }
    .modal-preview-frame {

    .modal-preview-frame > img {

    .zoom-guide-bg {

    .hand-gesture-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .zoom-guide-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .time-label { font-size: 13px; font-weight: 800; color: #7c5c3e; margin-bottom: 6px; }
    .time-pill {

    .time-clock-dot {

    }
    .stars-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px; }
    .star-icon { font-size: 36px; filter: drop-shadow(0 3px 0 rgba(210, 128, 32, 0.5)); animation: starPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    @keyframes starPop {
      0% { transform: scale(0.2) rotate(-25deg); opacity: 0; }
      100% { transform: scale(1) rotate(0); opacity: 1; }

    .btn-win-next {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: #ffc44d;
      border: 2.5px solid #4a311d;

    .btn-mint-ok {

      padding: 12px;
      border-radius: 12px;

    .gear-btn {

    /* ===== Home Screen (Plan-1 Clean Sunlit Oak Wood & Hand-Drawn Stationery Style) ===== */
    .home-screen {
      position: absolute;
      inset: 0;
      z-index: 65;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(14px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));

    }

    }

      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

      display: flex;
      align-items: center;
      gap: 10px;
    }

      align-items: center;
      gap: 8px;
      padding: 0 15px 0 9px;
      height: 40px;
      border-radius: 999px;
      border: 2.2px solid #442c1a;
      background: linear-gradient(180deg, #fcf4e4 0%, #f3e2c3 100%);

      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.08s ease;

    .stamina-pill:active { transform: translateY(1.5px) scale(0.97); }
    .stamina-heart {
      position: relative;
      width: 28px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .stamina-heart svg { width: 28px; height: 26px; display: block; }
    .stamina-heart-num {
      position: absolute;
      top: 50%;

            <span class="stamina-heart" aria-hidden="true">
              <svg viewBox="0 0 36 34">
                <path d="M18 31 C18 31 4 22.4 4 12.2 C4 7.3 7.7 4 12.2 4 C15.0 4 17.0 5.5 18 7.4 C19.0 5.5 21.0 4 23.8 4 C28.3 4 32 7.3 32 12.2 C32 22.4 18 31 18 31 Z" fill="#f07e67" stroke="#442c1a" stroke-width="2.6" stroke-linejoin="round"/>
              </svg>
              <span class="stamina-heart-num">5</span>
            </span>
            <span>体力已满</span>
          </button>
        </div>

        <button id="btnHomeShare" class="home-share-wrap" type="button" title="分享游戏">
          <img class="home-share-icon" src="./assets/ui/btn_share.webp?v=ui3" alt="分享" />
          <span class="home-share-label">分享</span>
        </button>
      </div>

      <div class="home-center-stack">
        <img class="home-logo-img" src="./assets/ui/home_logo.webp?v=ui3" alt="收纳日记 Tidy Diary" />

        <div class="home-btn-stack">
          <div class="home-start-group">
            <button id="btnStartGame" class="home-start-btn" type="button">
              <span class="home-start-text">开始游戏</span>
              <svg width="22" height="20" viewBox="0 0 36 34" aria-hidden="true">
                <path d="M18 31 C18 31 4 22.4 4 12.2 C4 7.3 7.7 4 12.2 4 C15.0 4 17.0 5.5 18 7.4 C19.0 5.5 21.0 4 23.8 4 C28.3 4 32 7.3 32 12.2 C32 22.4 18 31 18 31 Z" fill="#f07e67" stroke="#442c1a" stroke-width="2.6" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="home-level-ribbon">
              <img src="./assets/ui/title_ribbon.webp?v=ui2" alt="" />
              <span id="homeLevelLabel" class="home-level-caption">第 1 关 · 我的书桌</span>
            </div>
          </div>

          <div class="home-levels-wrap">
            <button id="btnLevelList" class="home-levels-btn" type="button">
              <svg viewBox="0 0 26 24" fill="none" aria-hidden="true">
                <circle cx="4.5" cy="5.5" r="2" stroke="#442c1a" stroke-width="2"/>
                <rect x="10" y="3.8" width="13.5" height="3.4" rx="1.7" stroke="#442c1a" stroke-width="2"/>
                <circle cx="4.5" cy="12" r="2" stroke="#442c1a" stroke-width="2"/>
                <rect x="10" y="10.3" width="13.5" height="3.4" rx="1.7" stroke="#442c1a" stroke-width="2"/>
                <circle cx="4.5" cy="18.5" r="2" stroke="#442c1a" stroke-width="2"/>
                <rect x="10" y="16.8" width="13.5" height="3.4" rx="1.7" stroke="#442c1a" stroke-width="2"/>
              </svg>
              <span class="home-levels-text">关卡列表</span>
            </button>
            <span class="washi-new-tag">上新了</span>
          </div>
        </div>
      </div>

      <div class="home-bottom-mascot">
        <img id="homeBearMascot" class="home-bear-img" src="./assets/ui/home_bear_box.webp?v=ui3" alt="小熊收纳盒" />
        <div id="homePlayerId" class="home-player-id">10248866</div>
      </div>
    </div>

    <!-- Settings Modal (Shared by Home Screen & In-Level HUD) -->
    <div id="settingsOverlay" class="cute-modal-overlay hidden">
      <div class="cute-modal-card">
        <div class="cute-modal-banner">
          <span class="sticker-title">设置</span>
          <button id="btnSettingsClose" class="modal-close-x" type="button" aria-label="关闭">✕</button>
        </div>
        <div class="cute-modal-body">
          <div class="settings-rows">
            <div class="settings-row">
              <div class="settings-label-wrap">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M4 9.5H8L13.5 5V19L8 14.5H4C3.45 14.5 3 14.05 3 13.5V10.5C3 9.95 3.45 9.5 4 9.5Z" fill="#9a7554"/>
                  <path d="M16.5 8.8C17.8 9.8 18.5 10.9 18.5 12C18.5 13.1 17.8 14.2 16.5 15.2" stroke="#9a7554" stroke-width="2.2" stroke-linecap="round"/>
                  <path d="M19.2 6.5C21 8.1 21.8 9.9 21.8 12C21.8 14.1 21 15.9 19.2 17.5" stroke="#9a7554" stroke-width="2.2" stroke-linecap="round"/>
                </svg>
                <span>音乐</span>
              </div>
              <div class="cute-slider-wrap">
                <input id="sliderMusic" class="cute-range" type="range" min="0" max="100" value="35" aria-label="音乐音量" />
              </div>
            </div>

            <div class="settings-row">
              <div class="settings-label-wrap">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M10 17.5V6.5L20 4.5V15.5" stroke="#9a7554" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="7.5" cy="17.5" r="2.8" fill="#9a7554"/>
                  <circle cx="17.5" cy="15.5" r="2.8" fill="#9a7554"/>
                </svg>
                <span>音效</span>
              </div>
              <div class="cute-slider-wrap">
                <input id="sliderSfx" class="cute-range" type="range" min="0" max="100" value="100" aria-label="音效音量" />
              </div>
            </div>
          </div>

          <div class="settings-divider"></div>

          <div id="settingsLevelActions" class="settings-level-actions">
            <div class="settings-top-btns">
              <button id="btnSettingsHome" class="btn-amber-square" type="button" title="返回主页" aria-label="返回主页">
                <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
                  <path d="M5 15 L16 5 L27 15 V27 H19.5 V19.5 H12.5 V27 H5 Z" fill="#fffdf8" stroke="#8f5b12" stroke-width="2" stroke-linejoin="round"/>
                </svg>
              </button>
              <button id="btnSettingsReplay" class="btn-amber-wide" type="button">
                <span class="btn-outlined-txt">重玩</span>
                <svg width="22" height="20" viewBox="0 0 36 34" aria-hidden="true">
                  <path d="M18 31 C18 31 4 22.4 4 12.2 C4 7.3 7.7 4 12.2 4 C15.0 4 17.0 5.5 18 7.4 C19.0 5.5 21.0 4 23.8 4 C28.3 4 32 7.3 32 12.2 C32 22.4 18 31 18 31 Z" fill="#f25757" stroke="#5d3b1e" stroke-width="2.6" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
            <button id="btnSettingsContinue" class="btn-continue-mint" type="button">
              <span class="btn-outlined-txt btn-outlined-txt-mint">继续游戏</span>
              <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 4.8 C6 3.7 7.2 3 8.2 3.6 L19.6 10.8 C20.5 11.4 20.5 12.6 19.6 13.2 L8.2 20.4 C7.2 21 6 20.3 6 19.2 Z" fill="#fffdf8" stroke="#1f5c57" stroke-width="2.2" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>

          <div id="settingsHomeActions" class="hidden">
            <button id="btnSettingsDone" class="btn-continue-mint" type="button">
              <span class="btn-outlined-txt btn-outlined-txt-mint">好的</span>
            </button>
          </div>

          <div class="settings-footer-meta">
            <span id="settingsPlayerId">ID: 10248866</span>
            <span>0.2.22</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Level List Modal -->
    <div id="levelListOverlay" class="cute-modal-overlay hidden">
      <div class="cute-modal-card">
        <div class="cute-modal-banner">
          <span class="sticker-title">关卡列表</span>
          <button id="btnLevelListClose" class="modal-close-x" type="button" aria-label="关闭">✕</button>
        </div>
        <div class="cute-modal-body">
          <div id="levelListItems" class="level-list-items"></div>
        </div>
      </div>
    </div>

    <!-- Fail Modal (When Temporary Tray Slots Are Full) -->
    <div id="failOverlay" class="cute-modal-overlay hidden">
      <div class="cute-modal-card">
        <div class="fail-modal-banner">
          <span class="fail-sticker-title">失败</span>
          <button id="btnFailClose" class="modal-close-x" type="button" aria-label="关闭">✕</button>
        </div>
        <div class="cute-modal-body">
          <div class="fail-modal-actions">
            <button id="btnFailExtraSlot" class="btn-fail-slot" type="button">
              <span class="btn-outlined-txt">额外槽位</span>
              <svg width="24" height="18" viewBox="0 0 28 20" aria-hidden="true">
                <rect x="1.5" y="2" width="18" height="16" rx="4" fill="#9c6a27" stroke="#5d3b1e" stroke-width="1.6"/>
                <polygon points="19.5,7.2 26.5,3.4 26.5,16.6 19.5,12.8" fill="#9c6a27" stroke="#5d3b1e" stroke-width="1.6" stroke-linejoin="round"/>
                <polygon points="8.5,6.5 14.5,10 8.5,13.5" fill="#ffdf9a"/>
              </svg>
            </button>
            <button id="btnFailRestart" class="btn-fail-restart" type="button">
              <span class="btn-outlined-txt btn-outlined-txt-mint">重新开始</span>
              <svg width="22" height="20" viewBox="0 0 36 34" aria-hidden="true">
                <path d="M18 31 C18 31 4 22.4 4 12.2 C4 7.3 7.7 4 12.2 4 C15.0 4 17.0 5.5 18 7.4 C19.0 5.5 21.0 4 23.8 4 C28.3 4 32 7.3 32 12.2 C32 22.4 18 31 18 31 Z" fill="#f25757" stroke="#442c1a" stroke-width="2.6" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast-pill"></div>

    <!-- Level 1 Dual-Spotlight Tutorial -->
    <div id="tutorialOverlay" class="tut-overlay hidden">
      <svg class="tut-mask-svg">
        <defs>
          <filter id="spotBlur" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="16" />
          </filter>
          <mask id="tutSpotMask">
            <rect width="100%" height="100%" fill="white" />
            <ellipse id="spotHole1" cx="0" cy="0" rx="0" ry="0" fill="black" filter="url(#spotBlur)" />
            <ellipse id="spotHole2" cx="0" cy="0" rx="0" ry="0" fill="black" filter="url(#spotBlur)" />
          </mask>
        </defs>
        <rect width="100%" height="100%" fill="rgba(22, 16, 11, 0.72)" mask="url(#tutSpotMask)" />
      </svg>
      <div class="tut-blocker"></div>
      <div id="tutClickZone" class="tut-click-zone"></div>
      <div id="tutBubbleTop" class="tut-bubble"></div>
      <div id="tutBubbleBottom" class="tut-bubble"></div>
      <div id="tutArrow" class="tut-arrow">
        <svg width="32" height="36" viewBox="0 0 34 38">
          <path d="M12 4 H22 V19 H30 L17 34 L4 19 H12 Z" fill="#fffdf8" stroke="#4a311d" stroke-width="3" stroke-linejoin="round"/>
        </svg>
      </div>
      <button id="btnSkipTut" class="btn-skip-tut">跳过引导</button>
    </div>

    <!-- Level 2 Cute "提示" Pinch-to-Zoom Modal -->
    <div id="zoomGuideOverlay" class="cute-modal-overlay hidden">
      <div class="cute-modal-card">
        <div class="cute-modal-banner">
          <span class="sticker-title">提示</span>
        </div>
        <div class="cute-modal-body">
          <div style="font-size:14px;font-weight:800;color:#6e4f32;margin-bottom:12px;">
            双指可以放大和缩小场景屏幕，单指可左右拖动
          </div>
          <div class="modal-preview-frame">
            <img id="zoomGuideBg" class="zoom-guide-bg" src="./assets/backgrounds/bed_topdown.webp?v=td6" alt="房间预览" />
            <div class="hand-gesture-layer">
              <canvas id="zoomGuideCanvas" class="zoom-guide-canvas" aria-hidden="true"></canvas>
            </div>
          </div>
          <button id="btnDismissZoomGuide" class="btn-mint-ok">好的</button>
        </div>
      </div>
    </div>

    <!-- Cute "整理完毕!" Win / Lose Modal -->
    <div id="modalOverlay" class="cute-modal-overlay hidden">
      <div class="cute-modal-card">
        <div class="cute-modal-banner">
          <span class="banner-star" style="left:16px;top:12px;">⭐</span>
          <span class="banner-star" style="right:18px;bottom:8px;animation-delay:0.5s;">⭐</span>
          <span id="modalTitle" class="sticker-title">整理完毕!</span>
        </div>
        <div class="cute-modal-body">
          <div id="modalRoomWrap" class="modal-preview-frame">
            <img id="modalRoomPreview" src="./assets/backgrounds/desk_topdown.webp?v=td6" alt="整理后的桌面" />
          </div>
          <div id="modalWinInfo">
            <div class="time-label">本次整理耗时</div>
            <div class="time-pill">
              <span class="time-clock-dot">🕒</span>
              <span id="modalTimeVal">00:00</span>
            </div>
            <div id="modalStars" class="stars-row">
              <span class="star-icon" style="animation-delay:0.08s;">⭐</span>
              <span class="star-icon" style="animation-delay:0.20s;">⭐</span>
              <span class="star-icon" style="animation-delay:0.32s;">⭐</span>
            </div>
          </div>
          <p id="modalDesc" class="hidden" style="font-size:13px;font-weight:700;color:#7a5a3c;margin:0 0 14px;"></p>
          <div id="modalActions"></div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
