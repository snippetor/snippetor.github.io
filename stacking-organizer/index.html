<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>堆叠收纳 · 我的书房</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #2b231d;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    }

    /* Full-height responsive mobile frame */
    .game-shell {
      width: min(100vw, calc(100dvh * 0.54));
      max-width: 480px;
      height: 100dvh;
      max-height: 100dvh;
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5), 0 0 0 3px #432d1c;
      background: #f9edd4;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 540px) {
      .game-shell {
        width: 100vw;
        max-width: 100vw;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* Unified Flat Hand-Drawn Comic Ink Button */
    .ink-btn {
      border: 2.5px solid #432d1c;
      box-shadow: 0 3px 0 #432d1c;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      cursor: pointer;
      font-family: inherit;
    }
    .ink-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #432d1c;
    }
    .ink-btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    /* Flat Sunny Golden Header */
    .header-bar {
      position: relative;
      z-index: 40;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: max(8px, env(safe-area-inset-top)) 14px 9px;
      background: #f5c058;
      border-bottom: 2.5px solid #432d1c;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .icon-circle {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: #fffdf7;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #432d1c;
      padding: 0;
    }
    .header-center { text-align: center; }
    .header-title {
      font-size: 16px;
      font-weight: 900;
      color: #432d1c;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }
    .header-sub {
      font-size: 11px;
      font-weight: 700;
      color: #7c5226;
    }
    .btn-next-lvl {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      background: #fff7e2;
      color: #432d1c;
      font-size: 12px;
      font-weight: 800;
    }

    /* Full-bleed Room Stage Wrapper (boxes & tray float cleanly over the upper wall!) */
    .stage-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      background: #f7ead1;
    }

    /* PixiJS Playfield fills entire stage-wrap */
    .playfield {
      position: absolute;
      inset: 0;
      overflow: hidden;
      touch-action: none;
    }
    .playfield canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }

    /* Floating Top HUD (3D Open-Top Storage Bins + Gray Staging Tray) */
    .floating-hud {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      z-index: 30;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .boxes-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      align-items: stretch;
      pointer-events: none;
    }
    .box-card {
      position: relative;
      pointer-events: auto;
      transition: transform 0.26s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.22s ease;
    }

    /* True 3D Open-Top Trapezoid Storage Bin */
    .bin-active, .bin-btn, .bin-empty {
      position: relative;
      width: 100%;
      height: 86px;
      display: block;
      padding: 0;
      margin: 0;
      border: none;
      background: transparent;
      font-family: inherit;
    }
    .bin-btn {
      cursor: pointer;
      transition: transform 0.08s ease;
    }
    .bin-btn:active {
      transform: translateY(2px);
    }
    .bin-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 3px 2px rgba(67, 45, 28, 0.18));
    }
    .bin-content {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 26px;
      bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .bin-content-locked {
      gap: 4px;
      top: 27px;
      bottom: 8px;
    }
    .box-name {
      font-size: 16px;
      font-weight: 900;
      color: #432d1c;
      line-height: 1.1;
      margin-top: -2px;
    }
    /* Progress pill straddling bottom rim of the storage bin (exact screenshot detail!) */
    .box-badge-straddle {
      position: absolute;
      left: 50%;
      bottom: -5px;
      transform: translateX(-50%);
      padding: 1px 12px;
      border-radius: 6px;
      border: 2px solid #432d1c;
      font-size: 12px;
      font-weight: 900;
      color: #2b2016;
      font-variant-numeric: tabular-nums;
      line-height: 1.25;
      white-space: nowrap;
      z-index: 3;
      box-shadow: 0 1px 0 rgba(67, 45, 28, 0.25);
    }
    .box-quick {
      position: absolute;
      top: 6px;
      left: -2px;
      padding: 1.5px 7px;
      border-radius: 999px;
      background: #ea8848;
      border: 2px solid #432d1c;
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      cursor: pointer;
      z-index: 4;
      box-shadow: 0 1.5px 0 #432d1c;
    }
    .bin-locked-title {
      font-size: 12px;
      font-weight: 800;
      color: #b7afa6;
    }
    .bin-locked-pill {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      background: #3a3532;
      color: #ffd886;
    }

    .box-pop { animation: boxPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes boxPop {
      0% { transform: scale(1); }
      45% { transform: scale(1.08) translateY(-2px); }
      100% { transform: scale(1); }
    }
    .box-complete { animation: boxComplete 0.42s ease forwards; }
    @keyframes boxComplete {
      0% { transform: scale(1); opacity: 1; }
      35% { transform: scale(1.1) rotate(-1.5deg); opacity: 1; }
      100% { transform: scale(0.78) translateY(-28px); opacity: 0; }
    }
    .box-enter { animation: boxEnter 0.34s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes boxEnter {
      0% { transform: translateY(-18px) scale(0.84); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* Flat Light-Gray Staging Tray Bar floating directly under the 3 bins */
    .tray-container {
      pointer-events: auto;
      background: #d2cec6;
      border: 2.5px solid #432d1c;
      border-radius: 9px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      box-shadow: 0 3px 0 rgba(67, 45, 28, 0.22);
    }
    .tray-slot {
      flex: 1;
      height: 44px;
      border-radius: 6px;
      background: #fffaf0;
      border: 2px solid #432d1c;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .tray-slot img { width: 36px; height: 36px; object-fit: contain; pointer-events: none; }
    .tray-slot-locked {
      flex: 1;
      height: 44px;
      border-radius: 6px;
      background: #2b2826;
      border: 2px solid #432d1c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f7d99c;
      font-size: 9px;
      font-weight: 800;
      gap: 1px;
      cursor: pointer;
    }
    .tray-shake { animation: trayShake 0.35s ease; }
    @keyframes trayShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* Cartoon Cream Pan & Zoom Pills */
    .pan-hint-badge {
      position: absolute;
      left: 10px;
      bottom: 10px;
      z-index: 35;
      padding: 5px 10px;
      border-radius: 999px;
      background: #fffaf0;
      color: #432d1c;
      font-size: 11px;
      font-weight: 800;
      border: 2px solid #432d1c;
      box-shadow: 0 2px 0 #432d1c;
      pointer-events: none;
    }

    .zoom-pill {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 35;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border-radius: 999px;
      background: #fffaf0;
      border: 2px solid #432d1c;
      box-shadow: 0 2px 0 #432d1c;
    }
    .zoom-btn {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 1.5px solid #432d1c;
      background: #f5c058;
      color: #432d1c;
      font-size: 15px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }
    .zoom-btn:active { background: #e8aa38; }
    .zoom-readout {
      min-width: 38px;
      text-align: center;
      font-size: 11px;
      font-weight: 900;
      color: #432d1c;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }

    /* Flat Cozy Bottom Toolbar */
    .toolbar {
      position: relative;
      z-index: 40;
      flex-shrink: 0;
      background: #f5e2bf;
      border-top: 2.5px solid #432d1c;
      padding: 8px 12px max(10px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .tool-btn {
      flex: 1;
      padding: 7px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 900;
    }
    .tool-badge {
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      border: 1.5px solid #432d1c;
    }

    /* Flying overlay & Sparkles */
    .flying-item { position: fixed; pointer-events: none; z-index: 9999; will-change: transform; }
    .flying-item img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 6px 6px rgba(67, 45, 28, 0.3)); }
    .sparkle { position: fixed; pointer-events: none; z-index: 9998; font-size: 16px; animation: sparkleFloat 0.72s ease-out forwards; }
    @keyframes sparkleFloat {
      0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.15); opacity: 0; }
    }

    /* Toast */
    .toast-pill {
      position: absolute;
      left: 50%;
      top: 170px;
      transform: translateX(-50%) translateY(-8px);
      background: #432d1c;
      color: #fffaf0;
      padding: 7px 15px;
      border-radius: 999px;
      border: 2px solid #fffaf0;
      font-size: 12px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 95;
      white-space: nowrap;
    }
    .toast-pill.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Level 1 Dual-Spotlight Tutorial */
    .hidden { display: none !important; }
    .tut-overlay { position: absolute; inset: 0; z-index: 80; pointer-events: none; }
    .tut-mask-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .tut-blocker { position: absolute; inset: 0; pointer-events: auto; }
    .tut-click-zone { position: absolute; pointer-events: auto; cursor: pointer; border-radius: 16px; }
    .tut-arrow { position: absolute; pointer-events: none; z-index: 82; animation: tutBounce 0.8s ease-in-out infinite; }
    @keyframes tutBounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -10px); }
    }
    .tut-bubble {
      position: absolute;
      background: #fffdf5;
      border: 2.5px solid #432d1c;
      border-radius: 14px;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 800;
      color: #432d1c;
      box-shadow: 0 3px 0 #432d1c;
      white-space: nowrap;
      pointer-events: none;
      z-index: 82;
    }
    .tut-bubble::before {
      content: '';
      position: absolute;
      top: -8px;
      left: var(--arrow-x, 50%);
      margin-left: -6px;
      width: 12px;
      height: 12px;
      background: #fffdf5;
      border-left: 2.5px solid #432d1c;
      border-top: 2.5px solid #432d1c;
      transform: rotate(45deg);
    }
    .tut-accent { color: #d67617; }
    .btn-skip-tut {
      pointer-events: auto;
      position: absolute;
      right: 12px;
      bottom: 14px;
      z-index: 85;
      padding: 6px 13px;
      border-radius: 999px;
      background: rgba(42, 30, 20, 0.78);
      color: #fffaf0;
      font-size: 11px;
      font-weight: 800;
      border: 1.5px solid rgba(255, 250, 240, 0.4);
      cursor: pointer;
    }

    /* Adorable Flat Comic Modals */
    .cute-modal-overlay {
      position: absolute;
      inset: 0;
      z-index: 90;
      background: rgba(20, 14, 10, 0.56);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .cute-modal-card {
      width: 100%;
      max-width: 340px;
      background: #fffdf5;
      border: 2.5px solid #432d1c;
      border-radius: 20px;
      box-shadow: 0 6px 0 #432d1c, 0 20px 50px rgba(0, 0, 0, 0.4);
      position: relative;
      text-align: center;
    }
    .cute-modal-banner {
      position: relative;
      background: #ffc24e;
      border-bottom: 2.5px solid #432d1c;
      border-radius: 17px 17px 0 0;
      padding: 15px 16px 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sticker-title {
      font-size: 28px;
      font-weight: 900;
      color: #e87a24;
      letter-spacing: 2px;
      line-height: 1.1;
      paint-order: stroke fill;
      -webkit-text-stroke: 6px #ffffff;
      filter: drop-shadow(0 3px 0 #432d1c);
    }
    .banner-star {
      position: absolute;
      font-size: 20px;
      filter: drop-shadow(0 2px 0 #432d1c);
      animation: starTwinkle 1.8s ease-in-out infinite;
    }
    @keyframes starTwinkle {
      0%, 100% { transform: scale(1) rotate(-8deg); }
      50% { transform: scale(1.15) rotate(8deg); }
    }
    .cute-modal-body { padding: 16px 18px 20px; }
    .modal-preview-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 236px;
      margin: 0 auto 14px;
      border-radius: 14px;
      overflow: hidden;
      border: 2.5px solid #e0c7a3;
      background: #f5e6cc;
    }
    .modal-preview-frame img { width: 100%; height: 100%; object-fit: cover; object-position: center bottom; display: block; }
    .hand-gesture-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .hand-pinch-svg {
      width: 156px;
      height: 156px;
      filter: drop-shadow(0 4px 4px rgba(67, 45, 28, 0.3));
      animation: handPinchDemo 1.7s ease-in-out infinite;
    }
    @keyframes handPinchDemo {
      0%, 100% { transform: scale(0.92) translate(6px, 6px); }
      50% { transform: scale(1.06) translate(-4px, -4px); }
    }
    .time-label { font-size: 13px; font-weight: 800; color: #7c5c3e; margin-bottom: 6px; }
    .time-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #c9a788;
      color: #fff;
      padding: 4px 16px 4px 8px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      margin-bottom: 12px;
    }
    .time-clock-dot {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #fff;
      color: #b48a66;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .stars-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px; }
    .star-icon { font-size: 36px; filter: drop-shadow(0 3px 0 rgba(210, 128, 32, 0.5)); animation: starPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    @keyframes starPop {
      0% { transform: scale(0.2) rotate(-25deg); opacity: 0; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    .btn-win-next {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: #ffc44d;
      border: 2.5px solid #432d1c;
      box-shadow: 0 4px 0 #c9861d, 0 6px 0 #432d1c;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      text-shadow: 0 1.5px 0 #8a5612;
      cursor: pointer;
    }
    .btn-win-next:active { transform: translateY(2px); }
    .btn-mint-ok {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: #5cdbd0;
      border: 2.5px solid #2b6e68;
      box-shadow: 0 4px 0 #359e95;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      text-shadow: 0 1.5px 0 #267870;
      cursor: pointer;
    }
    .btn-mint-ok:active { transform: translateY(2px); }
    .btn-sub-link {
      margin-top: 10px;
      background: transparent;
      border: none;
      color: #8c6a4a;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>

<body>
  <div id="gameShell" class="game-shell">
    <!-- Top Sunny Header -->
    <div class="header-bar">
      <div class="header-left">
        <button id="btnSound" title="开关音效" class="ink-btn icon-circle">
          <svg id="iconSoundOn" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="#f5c058"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <svg id="iconSoundOff" class="hidden" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="#d6c5b3"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>
        <button id="btnRestart" title="重新开始" class="ink-btn icon-circle">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>
      </div>
      <div class="header-center">
        <div id="levelTitle" class="header-title">我的书房</div>
        <div id="levelSubtitle" class="header-sub">第 1 关 · 剩余 21 件</div>
      </div>
      <button id="btnLevelSwitch" class="ink-btn btn-next-lvl">下一关</button>
    </div>

    <!-- Full-Bleed Room Stage + Floating 3D Storage Bins & Tray -->
    <div class="stage-wrap">
      <!-- PixiJS v8 Playfield -->
      <div id="playfield" class="playfield">
        <div id="panHintBadge" class="pan-hint-badge hidden">👈 左右拖动浏览大场景 👉</div>
        <div class="zoom-pill" id="zoomPill">
          <button id="btnZoomOut" class="zoom-btn" title="缩小">−</button>
          <span id="zoomReadout" class="zoom-readout" title="重置缩放">100%</span>
          <button id="btnZoomIn" class="zoom-btn" title="放大">+</button>
        </div>
      </div>

      <!-- Floating Top 3D Open-Top Storage Bins + Gray Staging Tray -->
      <div class="floating-hud">
        <div id="boxesRow" class="boxes-row"></div>
        <div id="trayContainer" class="tray-container"></div>
      </div>

      <!-- Toast -->
      <div id="toast" class="toast-pill"></div>
    </div>

    <!-- Bottom Helper Toolbar -->
    <div class="toolbar">
      <button id="btnUndo" class="ink-btn tool-btn" style="background:#fffaf0;color:#432d1c;">
        <span>↩️</span><span>撤回</span>
        <span id="undoCount" class="tool-badge" style="background:#f5c058;color:#432d1c;">3</span>
      </button>
      <button id="btnHint" class="ink-btn tool-btn" style="background:#e6f9f0;color:#205742;">
        <span>✨</span><span>提示</span>
        <span id="hintCount" class="tool-badge" style="background:#7ad8b4;color:#174232;">5</span>
      </button>
      <button id="btnMagnet" class="ink-btn tool-btn" style="background:#ffeedb;color:#7a3b12;">
        <span>🧲</span><span>自动收</span>
        <span id="magnetCount" class="tool-badge" style="background:#f38f48;color:#fff;">2</span>
      </button>
    </div>

    <!-- Level 1 Dual-Spotlight Tutorial -->
    <div id="tutorialOverlay" class="tut-overlay hidden">
      <svg class="tut-mask-svg">
        <defs>
          <filter id="spotBlur" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="16" />
          </filter>
          <mask id="tutSpotMask">
            <rect width="100%" height="100%" fill="white" />
            <ellipse id="spotHole1" cx="0" cy="0" rx="0" ry="0" fill="black" filter="url(#spotBlur)" />
            <ellipse id="spotHole2" cx="0" cy="0" rx="0" ry="0" fill="black" filter="url(#spotBlur)" />
          </mask>
        </defs>
        <rect width="100%" height="100%" fill="rgba(22, 16, 11, 0.72)" mask="url(#tutSpotMask)" />
      </svg>
      <div class="tut-blocker"></div>
      <div id="tutClickZone" class="tut-click-zone"></div>
      <div id="tutBubbleTop" class="tut-bubble"></div>
      <div id="tutBubbleBottom" class="tut-bubble"></div>
      <div id="tutArrow" class="tut-arrow">
        <svg width="34" height="38" viewBox="0 0 34 38">
          <path d="M12 4 H22 V19 H30 L17 34 L4 19 H12 Z" fill="#fffdf8" stroke="#432d1c" stroke-width="3" stroke-linejoin="round"/>
        </svg>
      </div>
      <button id="btnSkipTut" class="btn-skip-tut">跳过引导</button>
    </div>

    <!-- Level 2 Cute "提示" Pinch-to-Zoom Modal -->
    <div id="zoomGuideOverlay" class="cute-modal-overlay hidden">
      <div class="cute-modal-card">
        <div class="cute-modal-banner">
          <span class="sticker-title">提示</span>
        </div>
        <div class="cute-modal-body">
          <div style="font-size:14px;font-weight:800;color:#6e4f32;margin-bottom:12px;">
            双指可以放大和缩小场景屏幕，单指可左右拖动
          </div>
          <div class="modal-preview-frame">
            <img src="./assets/backgrounds/bedroom.webp?v=cute4" alt="房间预览" />
            <div class="hand-gesture-layer">
              <svg class="hand-pinch-svg" viewBox="0 0 160 160">
                <path d="M58 34 Q42 46 36 66" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
                <path d="M58 34 Q42 46 36 66" fill="none" stroke="#432d1c" stroke-width="3" stroke-linecap="round"/>
                <polygon points="36,72 28,58 44,61" fill="#fff" stroke="#432d1c" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M32 118 Q30 98 38 82" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
                <path d="M32 118 Q30 98 38 82" fill="none" stroke="#432d1c" stroke-width="3" stroke-linecap="round"/>
                <polygon points="40,76 30,86 45,89" fill="#fff" stroke="#432d1c" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M84 52 C80 42, 92 38, 98 48 L114 78 C120 74, 128 80, 125 90 L132 108 C136 122, 124 138, 108 136 L82 128 C70 124, 62 112, 62 98 C62 88, 70 84, 76 92 L82 100 L72 64 C69 54, 80 48, 84 52 Z"
                      fill="#ffffff" stroke="#432d1c" stroke-width="3.5" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
          <button id="btnDismissZoomGuide" class="btn-mint-ok">好的</button>
        </div>
      </div>
    </div>

    <!-- Cute "整理完毕!" Win / Lose Modal -->
    <div id="modalOverlay" class="cute-modal-overlay hidden">
      <div class="cute-modal-card">
        <div class="cute-modal-banner">
          <span class="banner-star" style="left:16px;top:12px;">⭐</span>
          <span class="banner-star" style="right:18px;bottom:8px;animation-delay:0.5s;">⭐</span>
          <span id="modalTitle" class="sticker-title">整理完毕!</span>
        </div>
        <div class="cute-modal-body">
          <div id="modalRoomWrap" class="modal-preview-frame">
            <img id="modalRoomPreview" src="./assets/backgrounds/study_room.webp?v=cute4" alt="整理后的房间" />
          </div>
          <div id="modalWinInfo">
            <div class="time-label">本次整理耗时</div>
            <div class="time-pill">
              <span class="time-clock-dot">🕒</span>
              <span id="modalTimeVal">00:00</span>
            </div>
            <div id="modalStars" class="stars-row">
              <span class="star-icon" style="animation-delay:0.08s;">⭐</span>
              <span class="star-icon" style="animation-delay:0.20s;">⭐</span>
              <span class="star-icon" style="animation-delay:0.32s;">⭐</span>
            </div>
          </div>
          <p id="modalDesc" class="hidden" style="font-size:13px;font-weight:700;color:#7a5a3c;margin:0 0 14px;"></p>
          <div id="modalActions"></div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
