<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>堆叠收纳 · 我的书桌</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #2b221b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    }

    /* Full-height responsive mobile container — frameless edge-to-edge desk! */
    .game-shell {
      width: min(100vw, calc(100dvh * 0.54));
      max-width: 480px;
      height: 100dvh;
      max-height: 100dvh;
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5), 0 0 0 2.5px #432d1c;
      background: #d8a56e;
    }

    @media (max-width: 540px) {
      .game-shell {
        width: 100vw;
        max-width: 100vw;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* Full-bleed PixiJS 90° Top-Down Playfield (100% of viewport height!) */
    .playfield {
      position: absolute;
      inset: 0;
      overflow: hidden;
      touch-action: none;
    }
    .playfield canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }

    /* Hand-drawn raster UI button interaction (100% authentic Plan 1 artwork!) */
    .ui-img-btn {
      border: none;
      background: transparent;
      padding: 0;
      margin: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease;
      filter: drop-shadow(0 2.5px 3px rgba(64, 38, 18, 0.24));
    }
    .ui-img-btn:active:not(:disabled) {
      transform: translateY(1.5px) scale(0.96);
    }
    .ui-img-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    /* Compact Frameless Top Floating HUD (100% Authentic Plan 1 Artwork!) */
    .floating-hud {
      position: absolute;
      top: max(8px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      z-index: 30;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    /* Row 1: Authentic Hand-Drawn Round Buttons + Serrated Paper Ribbon + Next Pill */
    .top-nav-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      pointer-events: none;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
    }
    .icon-circle {
      width: 36px;
      height: 36px;
    }

    .kraft-ribbon {
      position: relative;
      pointer-events: auto;
      width: 152px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2.5px 3px rgba(64, 38, 18, 0.22));
    }
    .kraft-ribbon-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
    }
    .ribbon-title {
      position: relative;
      z-index: 1;
      font-size: 14.5px;
      font-weight: 600;
      color: #3a2417;
      letter-spacing: 0.7px;
      white-space: nowrap;
      margin-top: -1px;
    }

    .btn-next-lvl {
      pointer-events: auto;
      width: 72px;
      height: 36px;
    }

    /* Row 2: Compact Authentic Plan-1 Hand-Drawn Boxes (true undistorted aspect ratio!) */
    .boxes-row {
      width: 100%;
      max-width: 312px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      align-items: center;
      pointer-events: none;
    }
    .box-card {
      position: relative;
      pointer-events: auto;
      transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.22s ease;
    }
    .bin-active, .bin-btn, .bin-empty {
      position: relative;
      width: 100%;
      aspect-ratio: 226 / 219;
      display: block;
      padding: 0;
      margin: 0;
      border: none;
      background: transparent;
      font-family: inherit;
    }
    .bin-btn {
      cursor: pointer;
      transition: transform 0.08s ease;
    }
    .bin-btn:active { transform: translateY(1.5px) scale(0.97); }
    .bin-art-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      filter: drop-shadow(0 3px 4px rgba(64, 38, 18, 0.22));
    }
    /* Exact Plan 1 pastel sticky label placed cleanly on front cream wall */
    .bin-sticker {
      position: absolute;
      left: 20%;
      right: 20%;
      bottom: 9%;
      height: 32%;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .bin-cat-name {
      font-size: 13px;
      font-weight: 600;
      color: #362216;
      line-height: 1.12;
    }
    .bin-cat-count {
      font-size: 11px;
      font-weight: 600;
      color: #442c1c;
      font-variant-numeric: tabular-nums;
      line-height: 1.12;
    }
    /* Hitbox aligned directly over the real painted peach "收1件" corner tape! */
    .box-quick {
      position: absolute;
      top: 38%;
      right: 0;
      width: 36%;
      height: 28%;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      z-index: 4;
    }
    .bin-empty-inner {
      position: absolute;
      inset: 6%;
      border: 2px dashed #8f6a45;
      border-radius: 12px;
      background: rgba(253, 246, 230, 0.42);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6d4b2a;
      font-size: 11.5px;
      font-weight: 900;
    }

    .box-pop { animation: boxPop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes boxPop {
      0% { transform: scale(1); }
      45% { transform: scale(1.07) translateY(-2px); }
      100% { transform: scale(1); }
    }
    .box-complete { animation: boxComplete 0.4s ease forwards; }
    @keyframes boxComplete {
      0% { transform: scale(1); opacity: 1; }
      35% { transform: scale(1.08) rotate(-1.5deg); opacity: 1; }
      100% { transform: scale(0.78) translateY(-24px); opacity: 0; }
    }
    .box-enter { animation: boxEnter 0.32s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes boxEnter {
      0% { transform: translateY(-16px) scale(0.84); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* Row 3: Compact Authentic Plan-1 Carved Oak 7-Slot Wooden Tray (7 equal-width wide slots: 5 cream + 2 locked) */
    .tray-container {
      position: relative;
      pointer-events: auto;
      width: 312px;
      max-width: 94%;
      aspect-ratio: 620 / 146;
      filter: drop-shadow(0 3px 4px rgba(64, 38, 18, 0.24));
    }
    .tray-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
    }
    .tray-slots-grid {
      position: absolute;
      top: 9%;
      bottom: 24%;
      left: 2.3%;
      right: 2.3%;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1.3%;
      align-items: stretch;
    }
    .tray-slot {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .tray-slot-unlocked-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 3px;
      pointer-events: none;
    }
    .tray-slot img.tray-item-img {
      position: relative;
      z-index: 2;
      width: 82%;
      height: 82%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 1.5px 1.5px rgba(64, 38, 18, 0.3));
    }
    .tray-slot-locked {
      position: relative;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
    }
    .tray-slot-locked:active { background: rgba(255, 236, 190, 0.18); border-radius: 4px; }
    .tray-shake { animation: trayShake 0.35s ease; }
    @keyframes trayShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* Pan hint badge (only for wide Level 2/3 scenes) */
    .pan-hint-badge {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 35;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(253, 246, 230, 0.92);
      color: #442c1a;
      font-size: 10.5px;
      font-weight: 800;
      border: 1.8px solid #442c1a;
      box-shadow: 0 2px 3px rgba(68, 44, 26, 0.24);
      pointer-events: none;
      white-space: nowrap;
    }

    /* Flying overlay & Sparkles */
    .flying-item { position: fixed; pointer-events: none; z-index: 9999; will-change: transform; }
    .flying-item img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 6px 6px rgba(67, 45, 28, 0.3)); }
    .sparkle { position: fixed; pointer-events: none; z-index: 9998; font-size: 16px; animation: sparkleFloat 0.72s ease-out forwards; }
    @keyframes sparkleFloat {
      0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.15); opacity: 0; }
    }

    /* Toast */
    .toast-pill {
      position: absolute;
      left: 50%;
      top: 170px;
      transform: translateX(-50%) translateY(-8px);
      background: rgba(74, 49, 29, 0.92);
      color: #fffaf0;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1.5px solid #f5e5c5;
      font-size: 11.5px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 95;
      white-space: nowrap;
    }
    .toast-pill.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Level 1 Dual-Spotlight Tutorial */
    .hidden { display: none !important; }
    .tut-overlay { position: absolute; inset: 0; z-index: 80; pointer-events: none; }
    .tut-mask-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .tut-blocker { position: absolute; inset: 0; pointer-events: auto; }
    .tut-click-zone { position: absolute; pointer-events: auto; cursor: pointer; border-radius: 16px; }
    .tut-arrow { position: absolute; pointer-events: none; z-index: 82; animation: tutBounce 0.8s ease-in-out infinite; }
    @keyframes tutBounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -10px); }
    }
    .tut-bubble {
      position: absolute;
      background: #fffdf5;
      border: 2.2px solid #4a311d;
      border-radius: 13px;
      padding: 8px 14px;
      font-size: 13.5px;
      font-weight: 800;
      color: #4a311d;
      box-shadow: 0 3px 0 #4a311d;
      white-space: nowrap;
      pointer-events: none;
      z-index: 82;
    }
    .tut-bubble::before {
      content: '';
      position: absolute;
      top: -7px;
      left: var(--arrow-x, 50%);
      margin-left: -6px;
      width: 11px;
      height: 11px;
      background: #fffdf5;
      border-left: 2.2px solid #4a311d;
      border-top: 2.2px solid #4a311d;
      transform: rotate(45deg);
    }
    .tut-accent { color: #d67617; }
    .btn-skip-tut {
      pointer-events: auto;
      position: absolute;
      right: 12px;
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 85;
      padding: 6px 13px;
      border-radius: 999px;
      background: rgba(42, 30, 20, 0.78);
      color: #fffaf0;
      font-size: 11px;
      font-weight: 800;
      border: 1.5px solid rgba(255, 250, 240, 0.4);
      cursor: pointer;
    }

    /* Adorable Flat Comic Modals */
    .cute-modal-overlay {
      position: absolute;
      inset: 0;
      z-index: 90;
      background: rgba(20, 14, 10, 0.56);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .cute-modal-card {
      width: 100%;
      max-width: 340px;
      background: #fffdf5;
      border: 2.5px solid #4a311d;
      border-radius: 20px;
      box-shadow: 0 6px 0 #4a311d, 0 20px 50px rgba(0, 0, 0, 0.4);
      position: relative;
      text-align: center;
    }
    .cute-modal-banner {
      position: relative;
      background: #ffc24e;
      border-bottom: 2.5px solid #4a311d;
      border-radius: 17px 17px 0 0;
      padding: 15px 16px 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sticker-title {
      font-size: 28px;
      font-weight: 900;
      color: #e87a24;
      letter-spacing: 2px;
      line-height: 1.1;
      paint-order: stroke fill;
      -webkit-text-stroke: 6px #ffffff;
      filter: drop-shadow(0 3px 0 #4a311d);
    }
    .banner-star {
      position: absolute;
      font-size: 20px;
      filter: drop-shadow(0 2px 0 #4a311d);
      animation: starTwinkle 1.8s ease-in-out infinite;
    }
    @keyframes starTwinkle {
      0%, 100% { transform: scale(1) rotate(-8deg); }
      50% { transform: scale(1.15) rotate(8deg); }
    }
    .cute-modal-body { padding: 16px 18px 20px; }
    .modal-preview-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 236px;
      margin: 0 auto 14px;
      border-radius: 14px;
      overflow: hidden;
      border: 2.5px solid #e0c7a3;
      background: #f5e6cc;
    }
    .modal-preview-frame img { width: 100%; height: 100%; object-fit: cover; object-position: center bottom; display: block; }
    .hand-gesture-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .hand-pinch-svg {
      width: 168px;
      height: 168px;
      filter: drop-shadow(0 4px 5px rgba(67, 45, 28, 0.28));
      overflow: visible;
    }
    .pinch-hand-group {
      transform-origin: 96px 104px;
      animation: handPinchDemo 1.8s ease-in-out infinite;
    }
    .pinch-arrow-top {
      animation: pinchArrowTop 1.8s ease-in-out infinite;
    }
    .pinch-arrow-bot {
      animation: pinchArrowBot 1.8s ease-in-out infinite;
    }
    .pinch-ripple {
      transform-box: fill-box;
      transform-origin: center;
      animation: pinchRipple 1.8s ease-in-out infinite;
    }
    @keyframes handPinchDemo {
      0%, 100% { transform: translate(3px, 3px) scale(0.95); }
      50% { transform: translate(-2px, -2px) scale(1.03); }
    }
    @keyframes pinchArrowTop {
      0%, 100% { transform: translate(4px, 4px); opacity: 0.85; }
      50% { transform: translate(-5px, -5px); opacity: 1; }
    }
    @keyframes pinchArrowBot {
      0%, 100% { transform: translate(-4px, -4px); opacity: 0.85; }
      50% { transform: translate(5px, 5px); opacity: 1; }
    }
    @keyframes pinchRipple {
      0%, 100% { transform: scale(0.85); opacity: 0.45; }
      50% { transform: scale(1.22); opacity: 0.9; }
    }
    .time-label { font-size: 13px; font-weight: 800; color: #7c5c3e; margin-bottom: 6px; }
    .time-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #c9a788;
      color: #fff;
      padding: 4px 16px 4px 8px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      margin-bottom: 12px;
    }
    .time-clock-dot {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #fff;
      color: #b48a66;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .stars-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px; }
    .star-icon { font-size: 36px; filter: drop-shadow(0 3px 0 rgba(210, 128, 32, 0.5)); animation: starPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    @keyframes starPop {
      0% { transform: scale(0.2) rotate(-25deg); opacity: 0; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    .btn-win-next {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: #ffc44d;
      border: 2.5px solid #4a311d;
      box-shadow: 0 4px 0 #c9861d, 0 6px 0 #4a311d;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      text-shadow: 0 1.5px 0 #8a5612;
      cursor: pointer;
    }
    .btn-win-next:active { transform: translateY(2px); }
    .btn-mint-ok {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: #5cdbd0;
      border: 2.5px solid #2b6e68;
      box-shadow: 0 4px 0 #359e95;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      text-shadow: 0 1.5px 0 #267870;
      cursor: pointer;
    }
    .btn-mint-ok:active { transform: translateY(2px); }
    .btn-sub-link {
      margin-top: 10px;
      background: transparent;
      border: none;
      color: #8c6a4a;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>

<body>
  <div id="gameShell" class="game-shell">
    <!-- Full-Bleed 100% Height PixiJS Playfield -->
    <div id="playfield" class="playfield">
      <div id="panHintBadge" class="pan-hint-badge hidden">👈 左右拖动浏览大场景 👉</div>
    </div>

    <!-- Compact Frameless Floating HUD (100% Authentic Plan 1 Hand-Drawn Artwork!) -->
    <div class="floating-hud">
      <div class="top-nav-row">
        <div class="nav-left">
          <button id="btnSound" title="开关音效" class="ui-img-btn icon-circle">
            <img id="iconSoundOn" src="./assets/ui/btn_sound.webp?v=ui2" alt="音效开" />
            <img id="iconSoundOff" class="hidden" src="./assets/ui/btn_sound_off.webp?v=ui2" alt="音效关" />
          </button>
          <button id="btnRestart" title="重新开始" class="ui-img-btn icon-circle">
            <img src="./assets/ui/btn_restart.webp?v=ui2" alt="重新开始" />
          </button>
        </div>

        <div class="kraft-ribbon">
          <img class="kraft-ribbon-img" src="./assets/ui/title_ribbon.webp?v=ui2" alt="" />
          <span id="levelTitle" class="ribbon-title">我的书桌 · 第1关</span>
        </div>

        <button id="btnLevelSwitch" title="下一关" class="ui-img-btn btn-next-lvl">
          <img src="./assets/ui/btn_next.webp?v=ui2" alt="下一关" />
        </button>
      </div>

      <div id="boxesRow" class="boxes-row"></div>
      <div id="trayContainer" class="tray-container"></div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast-pill"></div>

    <!-- Level 1 Dual-Spotlight Tutorial -->
    <div id="tutorialOverlay" class="tut-overlay hidden">
      <svg class="tut-mask-svg">
        <defs>
          <filter id="spotBlur" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="16" />
          </filter>
          <mask id="tutSpotMask">
            <rect width="100%" height="100%" fill="white" />
            <ellipse id="spotHole1" cx="0" cy="0" rx="0" ry="0" fill="black" filter="url(#spotBlur)" />
            <ellipse id="spotHole2" cx="0" cy="0" rx="0" ry="0" fill="black" filter="url(#spotBlur)" />
          </mask>
        </defs>
        <rect width="100%" height="100%" fill="rgba(22, 16, 11, 0.72)" mask="url(#tutSpotMask)" />
      </svg>
      <div class="tut-blocker"></div>
      <div id="tutClickZone" class="tut-click-zone"></div>
      <div id="tutBubbleTop" class="tut-bubble"></div>
      <div id="tutBubbleBottom" class="tut-bubble"></div>
      <div id="tutArrow" class="tut-arrow">
        <svg width="32" height="36" viewBox="0 0 34 38">
          <path d="M12 4 H22 V19 H30 L17 34 L4 19 H12 Z" fill="#fffdf8" stroke="#4a311d" stroke-width="3" stroke-linejoin="round"/>
        </svg>
      </div>
      <button id="btnSkipTut" class="btn-skip-tut">跳过引导</button>
    </div>

    <!-- Level 2 Cute "提示" Pinch-to-Zoom Modal -->
    <div id="zoomGuideOverlay" class="cute-modal-overlay hidden">
      <div class="cute-modal-card">
        <div class="cute-modal-banner">
          <span class="sticker-title">提示</span>
        </div>
        <div class="cute-modal-body">
          <div style="font-size:14px;font-weight:800;color:#6e4f32;margin-bottom:12px;">
            双指可以放大和缩小场景屏幕，单指可左右拖动
          </div>
          <div class="modal-preview-frame">
            <img src="./assets/backgrounds/bed_topdown.webp?v=td6" alt="房间预览" style="object-position: center 56%;" />
            <div class="hand-gesture-layer">
              <svg class="hand-pinch-svg" viewBox="0 0 180 180" aria-hidden="true">
                <defs>
                  <linearGradient id="handFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#fffdf8"/>
                    <stop offset="82%" stop-color="#f8eedc"/>
                    <stop offset="100%" stop-color="#ebd8bb"/>
                  </linearGradient>
                  <linearGradient id="cuffFill" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#f9d277"/>
                    <stop offset="100%" stop-color="#e5b34e"/>
                  </linearGradient>
                </defs>

                <!-- Bidirectional diagonal pinch-zoom arrows -->
                <g class="pinch-arrow-top">
                  <line x1="66" y1="54" x2="36" y2="24" stroke="#fffdf8" stroke-width="8.5" stroke-linecap="round"/>
                  <line x1="66" y1="54" x2="36" y2="24" stroke="#442c1a" stroke-width="3.6" stroke-linecap="round"/>
                  <path d="M34 40 L32 20 L52 22 Z" fill="#fffdf8" stroke="#442c1a" stroke-width="2.8" stroke-linejoin="round"/>
                </g>
                <g class="pinch-arrow-bot">
                  <line x1="64" y1="112" x2="34" y2="142" stroke="#fffdf8" stroke-width="8.5" stroke-linecap="round"/>
                  <line x1="64" y1="112" x2="34" y2="142" stroke="#442c1a" stroke-width="3.6" stroke-linecap="round"/>
                  <path d="M32 126 L30 146 L50 144 Z" fill="#fffdf8" stroke="#442c1a" stroke-width="2.8" stroke-linejoin="round"/>
                </g>

                <!-- Soft fingertip touch ripples -->
                <circle class="pinch-ripple" cx="76" cy="60" r="13" fill="rgba(255,253,245,0.45)" stroke="#ffffff" stroke-width="2.2"/>
                <circle class="pinch-ripple" cx="68" cy="106" r="12" fill="rgba(255,253,245,0.45)" stroke="#ffffff" stroke-width="2.2"/>

                <!-- Cute hand-drawn cartoon right hand in clear thumb + index pinch pose -->
                <g class="pinch-hand-group">
                  <!-- Neatly tucked middle, ring, and pinky fingers curled cleanly behind palm -->
                  <rect x="122" y="90" width="15" height="22" rx="7.5" transform="rotate(-18 129 101)"
                        fill="#f2e3ca" stroke="#442c1a" stroke-width="3" stroke-linejoin="round"/>
                  <rect x="110" y="83" width="16" height="24" rx="8" transform="rotate(-20 118 95)"
                        fill="#f6ead6" stroke="#442c1a" stroke-width="3" stroke-linejoin="round"/>
                  <rect x="97" y="77" width="16" height="25" rx="8" transform="rotate(-22 105 89)"
                        fill="#faf2e2" stroke="#442c1a" stroke-width="3" stroke-linejoin="round"/>

                  <!-- Main palm + extended index finger (top-left) + extended thumb (lower-left) -->
                  <path d="M98,94
                           L84,59 C81,51 70,53 72,62 L85,99
                           C83,103 80,104 75,102 L68,99 C60,96 55,105 62,111
                           L81,126 C92,136 108,140 123,134
                           C136,129 144,117 141,103 L137,94
                           C134,88 124,90 125,97 L125,100
                           C123,94 114,94 113,101
                           C111,94 102,91 98,94 Z"
                        fill="url(#handFill)" stroke="#442c1a" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>

                  <!-- Subtle fingertip & palm details -->
                  <path d="M75,60 C77,58 80,58 81,61" fill="none" stroke="#c8ad88" stroke-width="2" stroke-linecap="round"/>
                  <path d="M64,104 C65,102 67,101 69,103" fill="none" stroke="#c8ad88" stroke-width="2" stroke-linecap="round"/>
                  <path d="M96,113 Q108,109 119,114" fill="none" stroke="#d4ba95" stroke-width="2" stroke-linecap="round"/>

                  <!-- Cozy warm sleeve cuff at bottom-right wrist -->
                  <path d="M111,134 L138,121 L147,139 C149,143 147,147 143,149 L121,159 C117,161 113,159 111,155 Z"
                        fill="url(#cuffFill)" stroke="#442c1a" stroke-width="3.2" stroke-linejoin="round"/>
                  <line x1="118" y1="143" x2="139" y2="133" stroke="#fff4d2" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>
                </g>
              </svg>
            </div>
          </div>
          <button id="btnDismissZoomGuide" class="btn-mint-ok">好的</button>
        </div>
      </div>
    </div>

    <!-- Cute "整理完毕!" Win / Lose Modal -->
    <div id="modalOverlay" class="cute-modal-overlay hidden">
      <div class="cute-modal-card">
        <div class="cute-modal-banner">
          <span class="banner-star" style="left:16px;top:12px;">⭐</span>
          <span class="banner-star" style="right:18px;bottom:8px;animation-delay:0.5s;">⭐</span>
          <span id="modalTitle" class="sticker-title">整理完毕!</span>
        </div>
        <div class="cute-modal-body">
          <div id="modalRoomWrap" class="modal-preview-frame">
            <img id="modalRoomPreview" src="./assets/backgrounds/desk_topdown.webp?v=td6" alt="整理后的桌面" />
          </div>
          <div id="modalWinInfo">
            <div class="time-label">本次整理耗时</div>
            <div class="time-pill">
              <span class="time-clock-dot">🕒</span>
              <span id="modalTimeVal">00:00</span>
            </div>
            <div id="modalStars" class="stars-row">
              <span class="star-icon" style="animation-delay:0.08s;">⭐</span>
              <span class="star-icon" style="animation-delay:0.20s;">⭐</span>
              <span class="star-icon" style="animation-delay:0.32s;">⭐</span>
            </div>
          </div>
          <p id="modalDesc" class="hidden" style="font-size:13px;font-weight:700;color:#7a5a3c;margin:0 0 14px;"></p>
          <div id="modalActions"></div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
